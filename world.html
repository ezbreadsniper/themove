<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>themove - world</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;font:12px monospace;color:#eee}
#view{position:absolute;inset:0}
#hud{position:absolute;left:8px;top:8px;background:#0008;padding:6px 8px;white-space:pre;pointer-events:none}
#help{position:absolute;right:8px;top:8px;background:#0008;padding:6px 8px;white-space:pre;pointer-events:none;opacity:.85}
#prompt{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);background:#000a;border:1px solid #fff4;padding:5px 12px;font:bold 15px monospace;letter-spacing:1px;display:none;pointer-events:none;text-shadow:1px 1px 0 #000}
#crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;display:none;pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px #0008}
#crosshair:before{left:6px;top:0;width:2px;height:14px}
#crosshair:after{left:0;top:6px;width:14px;height:2px}
#subtitle{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);max-width:70%;text-align:center;font:bold 16px monospace;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;display:none;pointer-events:none}
#click{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;font:bold 18px monospace;cursor:pointer}
</style>
</head>
<body>
<div id="view"></div>
<div id="hud"></div>
<div id="help">WASD move   Shift sprint   Alt walk   CapsLock walk/run
Space jump   C / Ctrl crouch   E interact
1 pistol  2 rifle  3 smg  0 holster
RMB / F aim   LMB fire   R reload   Q shoulder
X inspect   V melee   G smoke
mouse: look (click to lock, Esc to release)</div>
<div id="crosshair"></div>
<div id="prompt"></div>
<div id="subtitle"></div>
<div id="click">click to play</div>
<script type="module" src="/src/app/world-play.js"></script>
</body>
</html>
