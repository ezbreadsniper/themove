<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>themove - animation playground</title>
<style>
html,body{margin:0;background:#111;overflow:hidden;font:12px monospace;color:#eee}
#view{position:absolute;inset:0}
#hud{position:absolute;left:8px;top:8px;background:#0008;padding:6px 8px;white-space:pre;pointer-events:none}
#help{position:absolute;right:8px;top:8px;background:#0008;padding:6px 8px;white-space:pre;pointer-events:none}
</style>
</head>
<body>
<div id="view"></div>
<div id="hud"></div>
<div id="help">WASD move   Shift sprint   C crouch
1 pistol  2 rifle  3 smg  0 holster
RMB / F aim   LMB / Space fire   R reload
mouse drag: camera</div>
<script type="module" src="/src/app/play.js"></script>
</body>
</html>
